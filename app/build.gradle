apply plugin: 'com.android.application'

android {
    compileSdk = 37
    defaultConfig {
        applicationId = "com.github.kostasdrakonakis.example"
        minSdk = 23
        //noinspection OldTargetApi
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlin {
        jvmToolchain(21)
    }
    namespace = 'com.github.kostasdrakonakis.example'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
//    implementation 'com.github.kostasdrakonakis:android-navigator:1.2.6'
//    annotationProcessor 'com.github.kostasdrakonakis:android-navigator-compiler:1.2.6'
    implementation project(':android-navigator')
    implementation project(':android-navigator-annotations')
    annotationProcessor project(':android-navigator-compiler')
}
